teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      x: 0.4
      y: 0.4
    axis_angular:
      yaw: 2
    scale_angular:
      yaw: 0.5

    enable_button: 4    

    enable_turbo_button: -1      

    require_enable_button: false  
    publish_stamped_twist: true
    frame: 'base_link'

    publish_rate: 50.0
    deadzone: 0.3
    autorepeat_rate: 20.0
